stages:
  - lint
  - test
  - build

# ── Shared bases ──────────────────────────────────────────────────────────

.python_base:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [saas-linux-small-amd64]
  before_script:
    - pip install --quiet --require-hashes -r backend/requirements.lock

.node_base:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-alpine
  tags: [saas-linux-small-amd64]
  before_script:
    - cd frontend && npm ci

# ── Lint ──────────────────────────────────────────────────────────────────

lint:backend:
  extends: .python_base
  stage: lint
  before_script:
    - pip install --quiet ruff
  script:
    # The CLI is shipped to users verbatim from /api/cli/download, so it is
    # linted alongside the server rather than treated as a loose script.
    - ruff check backend/app backend/tests cli

# No frontend lint job: the project is plain JavaScript with no linter or type
# checker configured, so `build:frontend` below is the real compile-time check.

# ── Test ──────────────────────────────────────────────────────────────────

test:backend:
  extends: .python_base
  stage: test
  before_script:
    # The locked runtime set first, then the test extras on top. Installing
    # only `-e .[dev]` resolved from pyproject.toml, which carries no upper
    # bounds -- so CI was testing against different versions than the image
    # shipped, and the drift was invisible until something broke in prod.
    - pip install --quiet --require-hashes -r backend/requirements.lock
    - cd backend
    - pip install --quiet --no-deps -e "."
    - pip install --quiet -r requirements-dev.txt
  variables:
    # The app refuses to start in production with a placeholder SECRET_KEY, so
    # anything that imports app.main needs a real one. pytest gets these from
    # conftest; the bare import below does not, and used to fail here.
    ENVIRONMENT: "dev"
    SECRET_KEY: "ci-only-not-a-deployment-secret-0123456789abcdef"
    DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  script:
    # Import smoke test first — fails in seconds on broken wiring, rather than
    # after the whole suite has collected.
    - python -c "import app.main; print('app import OK')"
    # ...and again as prod, which is the configuration that actually ships:
    # the startup guards only run in that mode.
    - ENVIRONMENT=prod python -c "import app.main; print('app import OK (prod)')"
    - pytest -q --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
    expire_in: 14 days

build:frontend:
  extends: .node_base
  stage: test
  script:
    - npm run build
    # vite writes into backend/app/static, which the image copies in. If the
    # build silently produced nothing, the image would ship an empty SPA.
    - test -f ../backend/app/static/index.html
  artifacts:
    paths: [backend/app/static]
    expire_in: 14 days

# The registry audits its own dependencies, through itself. A tool that tells
# other people their lockfiles have CVEs should be held to the same standard,
# and this is also the only end-to-end exercise of the audit endpoint against
# real data.
audit:dependencies:
  extends: .python_base
  stage: test
  before_script:
    - pip install --quiet --require-hashes -r backend/requirements.lock
    - curl -fsSL "${MINIREG_URL}/api/cli/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - minireg --url "$MINIREG_URL" audit backend --fail-on high
    - minireg --url "$MINIREG_URL" audit frontend --fail-on high
  rules:
    # Needs the registry reachable; skipped where MINIREG_URL is unset.
    - if: '$MINIREG_URL'
  allow_failure: false

# ── Build ─────────────────────────────────────────────────────────────────

build:image:
  stage: build
  tags: [saas-linux-small-amd64]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.5
  services:
    # Explicit alias: GitLab derives a service's hostname from its image name, so
    # the dependency-proxy prefix would otherwise change it away from "docker" and
    # `docker info` would wait forever for a host that never comes up.
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - until docker info; do sleep 1; done
    # Log the dind daemon in to the dependency proxy so the Dockerfile's FROM
    # base images (node, python) also pull through the cache, not Docker Hub.
    - docker login -u $CI_DEPENDENCY_PROXY_USER -p $CI_DEPENDENCY_PROXY_PASSWORD $CI_DEPENDENCY_PROXY_SERVER
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg BASE_REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/ --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    # A tagged build is also the release, so publish it as :latest too.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG'
    - exists: [Dockerfile]
