# This file runs unchanged on both the internal GitLab and the public mirror.
#
# Nothing here names an internal host or service. Where packages come from is
# decided entirely by group variables the tools read themselves --
# PIP_INDEX_URL and NPM_CONFIG_REGISTRY -- so internally they resolve through
# the caching registry and on the mirror they resolve from PyPI and npmjs,
# with no difference in this file.
#
# The one extra job internally is a dependency audit, pulled in only when
# CI_TEMPLATES is set. On the mirror that variable does not exist, the
# include is skipped, and the pipeline is exactly what you see below.
include:
  - project: $CI_TEMPLATES
    ref: main
    file: /audit.yml
    rules:
      - if: $CI_TEMPLATES

stages:
  - lint
  - test
  - build

variables:
  # Plain images by default; override per project to use a mirror.
  PYTHON_IMAGE: python:3.14-slim
  NODE_IMAGE: node:22-alpine
  DOCKER_IMAGE: docker:29.8.2
  # Prefix for the Dockerfile's FROM lines. Empty means Docker Hub.
  BASE_REGISTRY: ""
  # Set USE_DHI to "true" to build the Python stages of both images on Docker
  # Hardened Images (no shell, no package manager) instead of
  # python:3.14-slim. Off by default, so the public mirror builds on slim.
  # DHI_PYTHON_IMAGE is the repository without a tag: the build installs into
  # its "-dev" variant and ships the plain one. The default is Docker's own DHI
  # registry, which needs a login; internally, set DHI_PYTHON_IMAGE as a CI/CD
  # variable to the registry mirror instead (kept out of this file, which is
  # mirrored public). debian13, not alpine: the hashed lock and Trivy are
  # glibc builds, the same as slim.
  USE_DHI: "false"
  DHI_PYTHON_IMAGE: "dhi.io/python"
  DHI_PYTHON_TAG: "3.14-debian13"

# ── Shared bases ──────────────────────────────────────────────────────────

.python_base:
  image: $PYTHON_IMAGE
  tags: [saas-linux-small-amd64]
  before_script:
    - pip install --quiet --require-hashes -r backend/requirements.lock

.node_base:
  image: $NODE_IMAGE
  tags: [saas-linux-small-amd64]
  before_script:
    - cd frontend && npm ci

# ── Lint ──────────────────────────────────────────────────────────────────

lint:backend:
  extends: .python_base
  stage: lint
  before_script:
    - pip install --quiet ruff
  script:
    # The CLI is shipped to users verbatim from /api/cli/download, so it is
    # linted alongside the server rather than treated as a loose script.
    - ruff check backend/app backend/tests cli scanner

# No frontend lint job: the project is plain JavaScript with no linter or type
# checker configured, so `build:frontend` below is the real compile-time check.

# ── Test ──────────────────────────────────────────────────────────────────

test:backend:
  extends: .python_base
  stage: test
  before_script:
    # The locked runtime set first, then the test extras on top. Installing
    # only `-e .[dev]` resolved from pyproject.toml, which carries no upper
    # bounds -- so CI was testing against different versions than the image
    # shipped, and the drift was invisible until something broke in prod.
    - pip install --quiet --require-hashes -r backend/requirements.lock
    - cd backend
    - pip install --quiet --no-deps -e "."
    - pip install --quiet -r requirements-dev.txt
  variables:
    # The app refuses to start in production with a placeholder SECRET_KEY, so
    # anything that imports app.main needs a real one. pytest gets these from
    # conftest; the bare import below does not, and used to fail here.
    ENVIRONMENT: "dev"
    SECRET_KEY: "ci-only-not-a-deployment-secret-0123456789abcdef"
    DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  script:
    # Import smoke test first — fails in seconds on broken wiring, rather than
    # after the whole suite has collected.
    - python -c "import app.main; print('app import OK')"
    # ...and again as prod, which is the configuration that actually ships:
    # the startup guards only run in that mode.
    - ENVIRONMENT=prod python -c "import app.main; print('app import OK (prod)')"
    - pytest -q --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
    expire_in: 14 days

build:frontend:
  extends: .node_base
  stage: test
  script:
    - npm run build
    # vite writes into backend/app/static, which the image copies in. If the
    # build silently produced nothing, the image would ship an empty SPA.
    - test -f ../backend/app/static/index.html
  artifacts:
    paths: [backend/app/static]
    expire_in: 14 days

# ── Build ─────────────────────────────────────────────────────────────────

# Both images build the same way: on the dind service, tagged by ref, with the
# USE_DHI switch. Each job sets IMAGE_REPO and IMAGE_DOCKERFILE.
.image_build:
  stage: build
  tags: [saas-linux-small-amd64]
  image: $DOCKER_IMAGE
  services:
    # Explicit alias: GitLab derives a service's hostname from its image name,
    # so a registry prefix on DOCKER_IMAGE would otherwise move it away from
    # "docker" and `docker info` would wait forever for a host that never
    # comes up.
    - name: $DOCKER_IMAGE-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Branch names can hold characters an image tag cannot (`ui/home` is a
    # valid branch and an invalid reference), so branches are tagged by their
    # slug. A release keeps its exact name: the slug would turn v1.2.3 into
    # v1-2-3.
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    # Push a single image manifest. Docker 29 builds into the containerd image
    # store and attaches a provenance attestation by default, which turns the
    # push into an OCI index; the GitLab registry rejects that with "blob
    # unknown to registry". Without attestations the push is one manifest.
    # USE_DHI swaps the builder and runtime Python images together: the
    # dependency stage builds against its image's libc, so the pair must match.
    - |
      PY_ARGS=""
      if [ "$USE_DHI" = "true" ]; then
        echo "USE_DHI=true: runtime image on ${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
        PY_ARGS="--build-arg PYTHON_BUILDER_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}-dev"
        PY_ARGS="$PY_ARGS --build-arg PYTHON_RUNTIME_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
      fi
      docker build --provenance=false --sbom=false --build-arg BASE_REGISTRY="$BASE_REGISTRY" $PY_ARGS \
        --file "$IMAGE_DOCKERFILE" --tag "$IMAGE_REPO:$IMAGE_TAG" .
    - docker push "$IMAGE_REPO:$IMAGE_TAG"
    # A tagged build is also the release, so publish it as :latest too.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_REPO:$IMAGE_TAG" "$IMAGE_REPO:latest"
        docker push "$IMAGE_REPO:latest"
      fi

# The registry: $CI_REGISTRY_IMAGE:<tag>.
build:image:
  extends: .image_build
  variables:
    IMAGE_REPO: $CI_REGISTRY_IMAGE
    IMAGE_DOCKERFILE: Dockerfile
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG'
    - exists: [Dockerfile]

# The Trivy scanner worker: $CI_REGISTRY_IMAGE/scanner:<tag>, so a deployment
# can pull a matching pair instead of building the worker on the host. Built
# from the same commit as the registry, it speaks the same scanner API.
build:scanner:
  extends: .image_build
  variables:
    IMAGE_REPO: $CI_REGISTRY_IMAGE/scanner
    IMAGE_DOCKERFILE: scanner/Dockerfile
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG'
    - exists: [scanner/Dockerfile]
