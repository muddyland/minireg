[project]
name = "minireg"
version = "1.0.0"
description = "Caching npm + PyPI package registry with tiered upstreams, OIDC, and CVE policy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx[http2]>=0.27.2",
    "redis>=5.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "authlib>=1.3.2",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.12",
    "packaging>=24.1",
    "orjson>=3.10.7",
    "aiofiles>=24.1.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
